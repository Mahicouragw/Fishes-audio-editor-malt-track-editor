name: Deploy

on:
  push:
    branches: [main, arena/*]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The built site is always downloadable from the workflow run, so a
      # branch build can be inspected without publishing it to Pages.
      - uses: actions/upload-artifact@v4
        with:
          name: wishes-audio-editor-dist
          path: dist
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Publish the site from main, and also from arena/* work branches so a
    # feature branch can go live without merging it. The github-pages
    # environment only allows main, therefore branch builds request the
    # separate, unprotected github-pages-branch environment (deploy-pages
    # supports a custom environment name; the branch rule then does not apply).
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'github-pages-branch' }}
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
